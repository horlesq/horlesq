<style>
  text {font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:23px}
  .ttl {font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;font-size:15px;fill:#9fb6d9}
  @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes sweep {0%{transform:translateX(-1000px)}55%,100%{transform:translateX(1000px)}}
  @keyframes breathe {0%,100%{opacity:.35}50%{opacity:.6}}
  @keyframes led {0%,100%{opacity:1}50%{opacity:.3}}
  .cur {animation:blink 1s step-end infinite}
  .sw {animation:sweep 7s ease-in-out infinite}
  .gl {animation:breathe 5s ease-in-out infinite}
  
</style>
