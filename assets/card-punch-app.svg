<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170" role="img" aria-label="punch-app: Mobile app for employee time tracking, shift punch clock and payroll management.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c3a"/><stop offset="1" stop-color="#18295a"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fd0ff" stop-opacity="0"/><stop offset=".5" stop-color="#e8f4ff"/><stop offset="1" stop-color="#5fd0ff" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="440" height="170" rx="16"/></clipPath>
</defs>
<style>
  text {font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}
  @keyframes sweep {0%{transform:translateX(-440px)}60%,100%{transform:translateX(440px)}}
  @keyframes pulse {0%,100%{opacity:1}50%{opacity:.35}}
  .sw {animation:sweep 6s ease-in-out infinite}
  .pl {animation:pulse 2s ease-in-out infinite}
</style>
<g clip-path="url(#r)">
  <rect width="440" height="170" fill="url(#bg)"/>
  <!-- tiny low-poly peaks in the corner -->
  <g opacity=".55">
    <polygon points="330,170 380,96 430,170" fill="#2b4478"/><polygon points="380,96 430,170 392,170" fill="#1f3463"/>
    <polygon points="380,96 368,118 384,124 393,116" fill="#dbe7f7"/>
    <polygon points="380,170 418,118 470,170" fill="#324f8a"/><polygon points="418,118 470,170 428,170" fill="#24396b"/>
    <polygon points="418,118 409,134 421,139 428,132" fill="#e8f0fb"/>
  </g>
  <rect class="sw" y="0" width="440" height="2" fill="url(#edge)"/>
  <text x="24" y="42" font-size="22" font-weight="800" fill="#eef5ff">⏱  punch-app</text>
  <circle class="pl" cx="331" cy="35" r="4" fill="#2cf5c4"/>
  <text x="341" y="40" font-size="12" font-weight="700" fill="#2cf5c4" letter-spacing="1.5">BUILDING</text>
  <text x="24" y="74" font-size="14.5" fill="#a9bfe3"><tspan x="24" dy="0">Mobile app for employee time tracking,</tspan><tspan x="24" dy="20">shift punch clock and payroll management.</tspan></text>
  <rect x="24" y="128" width="46" height="22" rx="11" fill="#1b2d55" stroke="#2f4a80"/><text x="47" y="143.5" text-anchor="middle" font-size="12" fill="#a9c4ef">Expo</text><rect x="77" y="128" width="103" height="22" rx="11" fill="#1b2d55" stroke="#2f4a80"/><text x="129" y="143.5" text-anchor="middle" font-size="12" fill="#a9c4ef">React Native</text><rect x="188" y="128" width="75" height="22" rx="11" fill="#1b2d55" stroke="#2f4a80"/><text x="225" y="143.5" text-anchor="middle" font-size="12" fill="#a9c4ef">Supabase</text>
  <circle cx="336" cy="139" r="5" fill="#3178c6"/>
  <text x="346" y="143.5" font-size="12.5" fill="#c9d8f2">TypeScript</text>
</g>
<rect x=".75" y=".75" width="438.5" height="168.5" rx="15.5" fill="none" stroke="#3a5a96" stroke-opacity=".7" stroke-width="1.5"/>
</svg>